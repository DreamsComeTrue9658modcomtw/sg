<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>好識集退保證金系統</title>
  <!-- Bootstrap 5 & SweetAlert2 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .main-card { max-width: 450px; margin: 20px auto; border-radius: 16px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    #previewImg, #uploadedPhoto { max-width: 100%; border-radius: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container py-3">
    <div class="card main-card p-4 bg-white">
      <h3 class="text-center fw-bold mb-4 text-primary">
        <i class="bi bi-shop me-2"></i>好識集退保證金
      </h3>
      
      <!-- 步驟一：填寫與上傳（新上傳攤商） -->
      <div id="step1">
        <div class="mb-3">
          <label class="form-label fw-bold text-secondary">選擇品牌/攤位號碼</label>
          <select id="stallSelect" class="form-select form-select-lg" onchange="onStallChange()">
            <option value="">載入品牌中...</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold text-secondary">登記電話末三碼</label>
          <input type="text" id="phoneInput" class="form-control form-control-lg" maxlength="3" placeholder="請輸入電話末 3 碼" inputmode="numeric">
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold text-secondary">拍攝收攤照</label>
          <input type="file" id="photoInput" class="form-control" accept="image/*" capture="environment">
          <img id="previewImg" class="img-fluid d-block mx-auto shadow-sm" style="display:none;">
        </div>

        <button id="submitBtn" class="btn btn-primary btn-lg w-100 fw-bold mb-3 shadow-sm" onclick="uploadData()">
          <i class="bi bi-cloud-upload me-2"></i>上傳照片退款
        </button>

        <hr class="my-3">

        <!-- 獨立查詢按鈕 -->
        <button id="resumeBtn" class="btn btn-outline-secondary w-100 fw-bold py-2" onclick="openQueryModal()">
          <i class="bi bi-search me-2"></i>我已上傳過，查詢退款進度
        </button>
      </div>

      <!-- 步驟二：狀態確認 -->
      <div id="step2" style="display:none;">
        <div id="statusBadge" class="alert alert-warning text-center fw-bold mb-4" role="alert">
          <i class="bi bi-hourglass-split me-2"></i>收攤照已上傳，等待退款
        </div>

        <div class="text-center mb-4">
          <span class="text-muted fs-6">可領保證金金額</span>
          <h1 id="displayAmount" class="text-danger fw-bold display-5 my-2">NT$ 0</h1>
          <p id="displayStall" class="fw-bold text-dark fs-5 mb-0"></p>
        </div>

        <div class="text-center mb-3">
          <img id="uploadedPhoto" class="img-fluid shadow-sm" style="display:none;">
        </div>

        <div id="actionArea" class="mt-4">
          <button class="btn btn-success btn-lg w-100 fw-bold py-3 shadow-sm" onclick="openConfirmModal()">
            <i class="bi bi-check-circle me-2"></i>【我已收到保證金】
          </button>
        </div>

        <div id="completedArea" class="text-center text-success fw-bold fs-4 mt-4" style="display:none;">
          🎉 已完成保證金退還手續！
        </div>

        <button class="btn btn-link text-secondary w-100 mt-3 text-decoration-none" onclick="location.reload()">
          <i class="bi bi-arrow-left me-1"></i>返回首頁
        </button>
      </div>
    </div>
  </div>

  <script>
    // 🔑 請確認替換為您的 GAS 部署 API 網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwzH8X104aGEYKXHoeVqv8UIiRVPoyMr-i8Qz7N64sVOJFD9OfGn94eSp7JorjNcg/exec";

    let availableStalls = [];
    let compressedPhotoBase64 = "";
    let selectedStallData = null;
    let currentStall = null;
    let pollTimer = null;

    loadStalls();

    function loadStalls() {
      fetch(`${GAS_API_URL}?action=getAvailableStalls`)
        .then(res => res.json())
        .then(res => {
          availableStalls = res.data || [];
          const select = document.getElementById('stallSelect');
          select.innerHTML = '<option value="">-- 請選擇您的品牌/攤位 --</option>';
          availableStalls.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.stall;
            opt.innerText = item.stall + ' - ' + item.name;
            select.appendChild(opt);
          });
        });
    }

    function onStallChange() {
      const val = document.getElementById('stallSelect').value;
      selectedStallData = availableStalls.find(x => x.stall === val) || null;
    }

    document.getElementById('photoInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDef = 800;
          let w = img.width, h = img.height;
          if (w > h && w > maxDef) { h *= maxDef / w; w = maxDef; }
          else if (h > maxDef) { w *= maxDef / h; h = maxDef; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          compressedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.6);
          const preview = document.getElementById('previewImg');
          preview.src = compressedPhotoBase64;
          preview.style.display = 'block';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function uploadData() {
      const phone = document.getElementById('phoneInput').value.trim();
      if (!selectedStallData) return Swal.fire('提示', '請先選擇品牌/攤位號碼！', 'warning');
      if (phone !== selectedStallData.phone) return Swal.fire('錯誤', '電話末三碼不正確！', 'error');
      if (!compressedPhotoBase64) return Swal.fire('提示', '請拍攝並上傳收攤照片！', 'warning');

      Swal.fire({ title: '照片上傳中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'submitVendorData',
          data: { stall: selectedStallData.stall, phone: phone, photo: compressedPhotoBase64 }
        })
      })
      .then(res => res.json())
      .then(res => {
        Swal.close();
        if (res.success) {
          currentStall = res.stall;
          showStep2({ stall: res.stall, name: res.name, amount: res.amount, status: '等待退款', localPhoto: compressedPhotoBase64 });
        } else {
          Swal.fire('失敗', res.message, 'error');
        }
      });
    }

    function openQueryModal() {
      Swal.fire({
        title: '查詢退款進度',
        html: `
          <input id="swalStall" class="swal2-input" placeholder="請輸入攤位號碼 (如: A01)" style="margin-bottom:10px;">
          <input id="swalPhone" class="swal2-input" placeholder="請輸入登記電話末 3 碼" maxlength="3" type="number">
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: '查詢',
        cancelButtonText: '取消',
        preConfirm: () => {
          const stall = document.getElementById('swalStall').value.trim();
          const phone = document.getElementById('swalPhone').value.trim();
          if (!stall || !phone) {
            Swal.showValidationMessage('請完整輸入攤位號碼與電話末三碼');
            return false;
          }
          return { stall: stall, phone: phone };
        }
      }).then((result) => {
        if (result.isConfirmed) {
          const queryData = result.value;
          Swal.fire({ title: '查詢中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

          fetch(`${GAS_API_URL}?action=resumeVendorStatus&stall=${encodeURIComponent(queryData.stall)}&phone=${encodeURIComponent(queryData.phone)}`)
            .then(res => res.json())
            .then(res => {
              Swal.close();
              if (res.success && res.found) {
                currentStall = res.stall;
                showStep2(res);
              } else {
                Swal.fire('查無紀錄', res.message || '找不到該攤位的上傳紀錄，請確認資料是否正確。', 'info');
              }
            });
        }
      });
    }

    function showStep2(info) {
      currentStall = info.stall; // 🔒 確保全域變數一定有值
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
      document.getElementById('displayAmount').innerText = 'NT$ ' + info.amount;
      document.getElementById('displayStall').innerText = info.stall + ' - ' + info.name;
      
      const img = document.getElementById('uploadedPhoto');
      if (info.localPhoto || info.imgDirectUrl) {
        img.src = info.localPhoto || info.imgDirectUrl;
        img.style.display = 'block';
      }

      if (info.status === '已完成退款' || info.status === '工作人員手動核退') {
        showCompletedUI();
      } else {
        startPolling(info.stall);
      }
    }

    // 🚀 最佳化：確認退款功能（增加安全防呆與即時動態提示）
    function openConfirmModal() {
      if (!currentStall) {
        return Swal.fire('錯誤', '找不到攤位資訊，請重新查詢。', 'error');
      }

      Swal.fire({
        title: '確認收到保證金？',
        text: `攤位：${currentStall}，請確認現金或轉帳已確實收到。`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: '確定收到',
        cancelButtonText: '返回',
        confirmButtonColor: '#198754'
      }).then((result) => {
        if (result.isConfirmed) {
          Swal.fire({ title: '核退處理中...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

          fetch(`${GAS_API_URL}?action=vendorConfirmRefund&stall=${encodeURIComponent(currentStall)}`)
            .then(res => res.json())
            .then(res => {
              Swal.close();
              if (res.success) {
                Swal.fire('完成', '已成功確認收到保證金！', 'success').then(() => {
                  showCompletedUI();
                });
              } else {
                Swal.fire('更新失敗', res.message || '請稍後再試或聯繫現場工作人員。', 'error');
              }
            })
            .catch(err => {
              Swal.close();
              Swal.fire('網路錯誤', '無法連接伺服器，請重試。', 'error');
            });
        }
      });
    }

    function startPolling(stall) {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        fetch(`${GAS_API_URL}?action=checkVendorStatus&stall=${encodeURIComponent(stall)}`)
          .then(res => res.json())
          .then(res => {
            if (res.status === '已完成退款' || res.status === '工作人員手動核退') showCompletedUI();
          });
      }, 3000);
    }

    function showCompletedUI() {
      document.getElementById('statusBadge').className = 'alert alert-success text-center fw-bold mb-4';
      document.getElementById('statusBadge').innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>保證金退還已完成';
      document.getElementById('actionArea').style.display = 'none';
      document.getElementById('completedArea').style.display = 'block';
      if (pollTimer) clearInterval(pollTimer);
    }
  </script>
</body>
</html>
